# 合并到 main 之前必须在 Windows（实际运行环境）和 Linux 上都跑通全部测试。
# 开发流程：先推到 staging 分支，两个平台都通过后再快进合并到 main；
# 电脑上的自动更新也会检查这个结果，Windows 没通过的提交不会安装。
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          cmd //c "mvnw.cmd -B clean test" 2>&1 | tee build.log
      - name: Test (Linux)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          sh ./mvnw -B clean test 2>&1 | tee build.log
      - name: 失败原因写进注解（日志下载受限时也能看到）
        if: failure()
        shell: bash
        run: |
          grep -E '\[ERROR\]|FAIL|Tests run:.*Fail|expected:|Exception' build.log | grep -v 'Help 1' | head -45 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.os }}
          path: target/surefire-reports/
